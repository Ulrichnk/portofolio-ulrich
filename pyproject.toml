[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ulrich-quantlab"
version = "1.0.0"
description = "Reproducible educational research in derivatives, rates and financial risk"
requires-python = ">=3.11"
dependencies = ["numpy>=2.0,<3", "scipy>=1.13,<2", "scikit-learn>=1.5,<2", "matplotlib>=3.8,<4"]

[project.optional-dependencies]
notebooks = ["jupyterlab>=4,<5"]

[tool.setuptools.packages.find]
where = ["src"]
